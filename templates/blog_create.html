{% extends 'base.html' %}

{% block content %}

<div class="card">

<div class="card-header">
    <h3>Create Blog</h3>
</div>

<div class="card-body">

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-success">

            Create Blog

        </button>

        <a href="{% url 'my_blogs' %}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</div>

{% endblock %}
