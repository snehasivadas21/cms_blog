{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

<h2>Admin Create Blog</h2>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <a href="{% url 'admin_blog_list' %}"
           class="btn btn-secondary">

            Cancel

    </a>

    <button type="submit"
            class="btn btn-success">

        Create Blog

    </button>

</form>

</div>

{% endblock %}
