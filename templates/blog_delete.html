{% extends 'base.html' %}

{% block content %}

<div class="card">

<div class="card-header bg-danger text-white">
    <h3>Delete Blog</h3>
</div>

<div class="card-body">

    <p>
        Are you sure you want to delete:
    </p>

    <h4>
        {{ blog.title }}
    </h4>

    <form method="post">

        {% csrf_token %}

        <button type="submit"
                class="btn btn-danger">

            Confirm Delete

        </button>

        <a href="{% url 'blog_detail' blog.id %}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</div>

{% endblock %}
