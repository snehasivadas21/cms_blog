{% extends 'base.html' %}

{% block content %}

<div class="card">

<div class="card-header">

    <h3>Upload Attachment</h3>

</div>

<div class="card-body">

    <form method="post"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit"
                class="btn btn-success">

            Upload

        </button>

        <a href="{% url 'blog_detail' blog.id %}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</div>

{% endblock %}
