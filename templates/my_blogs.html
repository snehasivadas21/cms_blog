{% extends 'base.html' %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

<h2>My Blogs</h2>

<a href="{% url 'blog_create' %}"
   class="btn btn-success">

    Create Blog

</a>

</div>

{% for blog in blogs %}

<div class="card mb-3">

<div class="card-body">

    <h4>{{ blog.title }}</h4>

    <p>
        Views: {{ blog.view_count }}
    </p>

    <p>
        Created: {{ blog.created_at }}
    </p>

    <a href="{% url 'blog_detail' blog.id %}"
       class="btn btn-primary">

        View

    </a>

    <a href="{% url 'blog_update' blog.id %}"
       class="btn btn-warning">

        Edit

    </a>

    <a href="{% url 'blog_delete' blog.id %}"
       class="btn btn-danger">

        Delete

    </a>

    <a href="{% url 'attachment_upload' blog.id %}"
       class="btn btn-secondary">

        Upload Image

    </a>

</div>

</div>

{% empty %}

<div class="alert alert-info">

You have not created any blogs yet.

</div>

{% endfor %}

{% endblock %}
