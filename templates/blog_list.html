{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Published Blogs</h2>

{% for blog in blogs %}

<div class="card mb-3">

<div class="card-body">

    <h4>{{ blog.title }}</h4>

    <p>
        Author: {{ blog.author.username }}
    </p>

    <p>
        Views: {{ blog.view_count }}
    </p>

    <a href="{% url 'blog_detail' blog.id %}"
       class="btn btn-primary">
        Read More
    </a>

</div>

</div>

{% empty %}

<p>No blogs available.</p>

{% endfor %}

{% endblock %}
